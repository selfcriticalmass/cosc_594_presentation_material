        <text y="484"><tspan x="612" fill="#ccc">0</tspan><tspan x="640" fill="#ccc">0</tspan><tspan x="668" fill="#ccc">0</tspan><tspan x="696" fill="#000">1</tspan><tspan x="724" fill="#000">1</tspan><tspan x="752" fill="#000">1</tspan><tspan x="780" fill="#ccc">0</tspan><tspan x="808" fill="#ccc">0</tspan></text>
        <text y="512"><tspan x="612" fill="#ccc">0</tspan><tspan x="640" fill="#ccc">0</tspan><tspan x="668" fill="#ccc">0</tspan><tspan x="696" fill="#ccc">0</tspan><tspan x="724" fill="#000">1</tspan><tspan x="752" fill="#000">1</tspan><tspan x="780" fill="#000">1</tspan><tspan x="808" fill="#000">1</tspan></text>
        <text y="540"><tspan x="612" fill="#ccc">0</tspan><tspan x="640" fill="#ccc">0</tspan><tspan x="668" fill="#ccc">0</tspan><tspan x="696" fill="#ccc">0</tspan><tspan x="724" fill="#ccc">0</tspan><tspan x="752" fill="#000">1</tspan><tspan x="780" fill="#000">1</tspan><tspan x="808" fill="#000">1</tspan></text>
        <text y="568"><tspan x="612" fill="#000">1</tspan><tspan x="640" fill="#ccc">0</tspan><tspan x="668" fill="#ccc">0</tspan><tspan x="696" fill="#ccc">0</tspan><tspan x="724" fill="#ccc">0</tspan><tspan x="752" fill="#ccc">0</tspan><tspan x="780" fill="#000">1</tspan><tspan x="808" fill="#000">1</tspan></text>
        <text y="596"><tspan x="612" fill="#000">1</tspan><tspan x="640" fill="#000">1</tspan><tspan x="668" fill="#ccc">0</tspan><tspan x="696" fill="#ccc">0</tspan><tspan x="724" fill="#ccc">0</tspan><tspan x="752" fill="#ccc">0</tspan><tspan x="780" fill="#ccc">0</tspan><tspan x="808" fill="#000">1</tspan></text>

        <!-- Matrix A2 -->
        <text y="400"><tspan x="928" fill="#000">1</tspan><tspan x="956" fill="#000">1</tspan><tspan x="984" fill="#000">1</tspan><tspan x="1012" fill="#000">1</tspan><tspan x="1040" fill="#000">1</tspan><tspan x="1068" fill="#ccc">0</tspan><tspan x="1096" fill="#ccc">0</tspan><tspan x="1124" fill="#ccc">0</tspan></text>
        <text y="428"><tspan x="928" fill="#ccc">0</tspan><tspan x="956" fill="#000">1</tspan><tspan x="984" fill="#000">1</tspan><tspan x="1012" fill="#000">1</tspan><tspan x="1040" fill="#000">1</tspan><tspan x="1068" fill="#000">1</tspan><tspan x="1096" fill="#000">1</tspan><tspan x="1124" fill="#000">1</tspan></text>
        <text y="456"><tspan x="928" fill="#ccc">0</tspan><tspan x="956" fill="#ccc">0</tspan><tspan x="984" fill="#000">1</tspan><tspan x="1012" fill="#000">1</tspan><tspan x="1040" fill="#000">1</tspan><tspan x="1068" fill="#000">1</tspan><tspan x="1096" fill="#000">1</tspan><tspan x="1124" fill="#000">1</tspan></text>
        <text y="484"><tspan x="928" fill="#ccc">0</tspan><tspan x="956" fill="#ccc">0</tspan><tspan x="984" fill="#ccc">0</tspan><tspan x="1012" fill="#000">1</tspan><tspan x="1040" fill="#000">1</tspan><tspan x="1068" fill="#000">1</tspan><tspan x="1096" fill="#000">1</tspan><tspan x="1124" fill="#000">1</tspan></text>
        <text y="512"><tspan x="928" fill="#000">1</tspan><tspan x="956" fill="#000">1</tspan><tspan x="984" fill="#ccc">0</tspan><tspan x="1012" fill="#ccc">0</tspan><tspan x="1040" fill="#000">1</tspan><tspan x="1068" fill="#000">1</tspan><tspan x="1096" fill="#000">1</tspan><tspan x="1124" fill="#000">1</tspan></text>
        <text y="540"><tspan x="928" fill="#000">1</tspan><tspan x="956" fill="#000">1</tspan><tspan x="984" fill="#ccc">0</tspan><tspan x="1012" fill="#ccc">0</tspan><tspan x="1040" fill="#ccc">0</tspan><tspan x="1068" fill="#000">1</tspan><tspan x="1096" fill="#000">1</tspan><tspan x="1124" fill="#000">1</tspan></text>
        <text y="568"><tspan x="928" fill="#000">1</tspan><tspan x="956" fill="#000">1</tspan><tspan x="984" fill="#000">1</tspan><tspan x="1012" fill="#ccc">0</tspan><tspan x="1040" fill="#ccc">0</tspan><tspan x="1068" fill="#ccc">0</tspan><tspan x="1096" fill="#000">1</tspan><tspan x="1124" fill="#000">1</tspan></text>
        <text y="596"><tspan x="928" fill="#000">1</tspan><tspan x="956" fill="#000">1</tspan><tspan x="984" fill="#000">1</tspan><tspan x="1012" fill="#000">1</tspan><tspan x="1040" fill="#000">1</tspan><tspan x="1068" fill="#ccc">0</tspan><tspan x="1096" fill="#ccc">0</tspan><tspan x="1124" fill="#000">1</tspan></text>

        <!-- Matrix A4 -->
        <text y="400"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="428"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="456"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="484"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="512"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="540"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="568"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
        <text y="596"><tspan x="1244" fill="#000">1</tspan><tspan x="1272" fill="#000">1</tspan><tspan x="1300" fill="#000">1</tspan><tspan x="1328" fill="#000">1</tspan><tspan x="1356" fill="#000">1</tspan><tspan x="1384" fill="#000">1</tspan><tspan x="1412" fill="#000">1</tspan><tspan x="1440" fill="#000">1</tspan></text>
    </g>

    <!-- Between Matrix A & A2 -->
    <text x="865" y="465" text-anchor="middle" font-size="16" fill="#333333">Boolean multiply</text>
    <text x="865" y="485" text-anchor="middle" font-size="16" fill="#333333">(∨, ∧)</text>
    <line x1="835" y1="500" x2="895" y2="500" class="edge" marker-end="url(#arrow)" />

    <!-- Between Matrix A2 & A4 -->
    <text x="1185" y="465" text-anchor="middle" font-size="16" fill="#333333">Boolean multiply</text>
    <text x="1185" y="485" text-anchor="middle" font-size="16" fill="#333333">(∨, ∧)</text>
    <line x1="1155" y1="500" x2="1215" y2="500" class="edge" marker-end="url(#arrow)" />

    <!-- Matrix Notes Below -->
    <text x="1026" y="720" text-anchor="middle" font-size="22" fill="#333333">After <tspan font-style="italic">k</tspan> squarings: paths up to length 2<tspan font-size="16" dy="-10">k</tspan></text>
    <text x="1026" y="755" text-anchor="middle" font-size="22" fill="#333333">Need ≈ ⌈log<tspan font-size="16" dy="10">2</tspan><tspan dy="-10"> </tspan><tspan font-style="italic">n</tspan>⌉ squarings</text>

    <!-- ========================================== -->
    <!-- RIGHT COLUMN: Discoveries List             -->
    <!-- ========================================== -->

    <text x="1540" y="300" font-size="28" font-weight="bold" fill="#000000">Example reachability</text>
    <text x="1540" y="335" font-size="28" font-weight="bold" fill="#000000">pairs discovered</text>

    <!-- Bullet Points -->
    <circle cx="1550" cy="425" r="5" class="blue-accent" />
    <text x="1575" y="432" font-size="24" fill="#000000">1 → 3 <tspan fill="#666666" font-size="20">(via 2)</tspan></text>

    <circle cx="1550" cy="485" r="5" class="blue-accent" />
    <text x="1575" y="492" font-size="24" fill="#000000">1 → 5 <tspan fill="#666666" font-size="20">(via 3)</tspan></text>

    <circle cx="1550" cy="545" r="5" class="blue-accent" />
    <text x="1575" y="552" font-size="24" fill="#000000">4 → 7 <tspan fill="#666666" font-size="20">(via 6)</tspan></text>

    <circle cx="1550" cy="605" r="5" class="blue-accent" />
    <text x="1575" y="612" font-size="24" fill="#000000">2 → 8 <tspan fill="#666666" font-size="20">(via 5)</tspan></text>

    <circle cx="1550" cy="665" r="5" class="blue-accent" />
    <text x="1575" y="672" font-size="24" fill="#000000">6 → 1 <tspan fill="#666666" font-size="20">(via 8)</tspan></text>

    <!-- ========================================== -->
    <!-- BOTTOM: Banner / Callout Box               -->
    <!-- ========================================== -->

    <rect x="150" y="840" width="1620" height="190" rx="8" ry="8" class="box-border" />

    <text x="960" y="890" text-anchor="middle" font-size="30" font-weight="bold" fill="#000000">All-pairs transitive closure by repeated squaring</text>

    <text x="960" y="935" text-anchor="middle" font-size="24" fill="#333333">Time: O(log<tspan font-size="16" dy="-10">2</tspan><tspan dy="10"> </tspan><tspan font-style="italic">n</tspan>) on EREW-PRAM</text>

    <text x="960" y="975" text-anchor="middle" font-size="24" fill="#333333">Processors: <tspan font-style="italic">n</tspan><tspan font-size="16" dy="-10">3</tspan><tspan dy="10"> / log </tspan><tspan font-style="italic">n</tspan> (or M(<tspan font-style="italic">n</tspan>)/log <tspan font-style="italic">n</tspan>)</text>

    <text x="960" y="1015" text-anchor="middle" font-size="24" fill="#333333">Work: ≈ <tspan font-style="italic">n</tspan><tspan font-size="16" dy="-10">3</tspan><tspan dy="10"> — good for dense, wasteful for sparse / single-source</tspan></text>

</svg>
