    <g class="matrix-text" font-size="22" text-anchor="middle">
        <!-- Matrix A -->
        <text y="400"><tspan x="612" fill="#000">1</tspan><tspan x="640" fill="#000">1</tspan><tspan x="668" fill="#000">1</tspan><tspan x="696" fill="#ccc">0</tspan><tspan x="724" fill="#ccc">0</tspan><tspan x="752" fill="#ccc">0</tspan><tspan x="780" fill="#ccc">0</tspan><tspan x="808" fill="#ccc">0</tspan></text>
        <text y="428"><tspan x="612" fill="#ccc">0</tspan><tspan x="640" fill="#000">1</tspan><tspan x="668" fill="#000">1</tspan><tspan x="696" fill="#000">1</tspan><tspan x="724" fill="#000">1</tspan><tspan x="752" fill="#ccc">0</tspan><tspan x="780" fill="#ccc">0</tspan><tspan x="808" fill="#ccc">0</tspan></text>
