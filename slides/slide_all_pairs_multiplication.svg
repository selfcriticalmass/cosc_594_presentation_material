<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
    <defs>
        <style>
            .bg { fill: #FFFFFF; }
            text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
            .matrix-text tspan { font-family: "Courier New", Courier, monospace; }
            .edge { stroke: #000000; stroke-width: 1.5; fill: none; }
            .edge-blue { stroke: #4B7DA1; stroke-width: 2; fill: none; stroke-dasharray: 6,4; }
            .node { fill: #FFFFFF; stroke: #000000; stroke-width: 2; }
            .node-text { fill: #000000; font-size: 20px; font-weight: bold; text-anchor: middle; dominant-baseline: central; }
            .title { font-size: 28px; font-weight: bold; fill: #000000; }
            .subtitle { font-size: 22px; fill: #333333; }
            .blue-accent { fill: #4B7DA1; }
            .bracket { fill: none; stroke: #000000; stroke-width: 2; }
            .box-border { fill: none; stroke: #4B7DA1; stroke-width: 3; }
        </style>

        <marker id="arrow" markerWidth="12" markerHeight="12" refX="30" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L0,12 L12,6 z" fill="#000000" />
        </marker>
        <marker id="blue-arrow" markerWidth="12" markerHeight="12" refX="32" refY="6" orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0,0 L0,12 L12,6 z" fill="#4B7DA1" />
        </marker>
    </defs>

    <!-- Background -->
    <rect class="bg" width="1920" height="1080" />

    <!-- ========================================== -->
    <!-- LEFT COLUMN: Dense Directed Graph          -->
    <!-- ========================================== -->

    <text x="310" y="200" text-anchor="middle" class="title">Dense directed graph (<tspan font-style="italic">n</tspan> nodes)</text>

    <!-- Graph Edges -->
    <g id="edges">
        <!-- Outer Cycle -->
        <line x1="310" y1="280" x2="423" y2="327" class="edge" marker-end="url(#arrow)" />
        <line x1="423" y1="327" x2="470" y2="440" class="edge" marker-end="url(#arrow)" />
        <line x1="470" y1="440" x2="423" y2="553" class="edge" marker-end="url(#arrow)" />
        <line x1="423" y1="553" x2="310" y2="600" class="edge" marker-end="url(#arrow)" />
        <line x1="310" y1="600" x2="197" y2="553" class="edge" marker-end="url(#arrow)" />
        <line x1="197" y1="553" x2="150" y2="440" class="edge" marker-end="url(#arrow)" />
        <line x1="150" y1="440" x2="197" y2="327" class="edge" marker-end="url(#arrow)" />
        <line x1="197" y1="327" x2="310" y2="280" class="edge" marker-end="url(#arrow)" />

        <!-- Inner Chords 1 -->
        <line x1="310" y1="280" x2="470" y2="440" class="edge" marker-end="url(#arrow)" />
        <line x1="470" y1="440" x2="310" y2="600" class="edge" marker-end="url(#arrow)" />
        <line x1="310" y1="600" x2="150" y2="440" class="edge" marker-end="url(#arrow)" />
        <line x1="150" y1="440" x2="310" y2="280" class="edge" marker-end="url(#arrow)" />

        <!-- Inner Chords 2 -->
        <line x1="423" y1="327" x2="423" y2="553" class="edge" marker-end="url(#arrow)" />
        <line x1="423" y1="553" x2="197" y2="553" class="edge" marker-end="url(#arrow)" />
        <line x1="197" y1="553" x2="197" y2="327" class="edge" marker-end="url(#arrow)" />
        <line x1="197" y1="327" x2="423" y2="327" class="edge" marker-end="url(#arrow)" />

        <!-- Extra Chords -->
        <line x1="423" y1="327" x2="310" y2="600" class="edge" marker-end="url(#arrow)" />
        <line x1="310" y1="600" x2="197" y2="327" class="edge" marker-end="url(#arrow)" />

        <!-- New Reachability Arrows (Dashed Blue) -->
        <path d="M 310 280 Q 450 310 470 440" class="edge-blue" marker-end="url(#blue-arrow)" />
        <text x="445" y="295" font-size="16" class="blue-accent" font-weight="bold">via 2</text>

        <path d="M 423 553 Q 250 560 150 440" class="edge-blue" marker-end="url(#blue-arrow)" />
        <text x="230" y="570" font-size="16" class="blue-accent" font-weight="bold">via 6</text>

        <path d="M 423 327 Q 310 520 197 327" class="edge-blue" marker-end="url(#blue-arrow)" />
        <text x="310" y="535" font-size="16" class="blue-accent" font-weight="bold" text-anchor="middle">via 5</text>
    </g>

    <!-- Graph Nodes -->
    <g id="nodes">
        <circle cx="310" cy="280" r="20" class="node" /><text x="310" y="280" class="node-text">1</text>
        <circle cx="423" cy="327" r="20" class="node" /><text x="423" y="327" class="node-text">2</text>
        <circle cx="470" cy="440" r="20" class="node" /><text x="470" y="440" class="node-text">3</text>
        <circle cx="423" cy="553" r="20" class="node" /><text x="423" y="553" class="node-text">4</text>
        <circle cx="310" cy="600" r="20" class="node" /><text x="310" y="600" class="node-text">5</text>
        <circle cx="197" cy="553" r="20" class="node" /><text x="197" y="553" class="node-text">6</text>
        <circle cx="150" cy="440" r="20" class="node" /><text x="150" y="440" class="node-text">7</text>
        <circle cx="197" cy="327" r="20" class="node" /><text x="197" y="327" class="node-text">8</text>
    </g>

    <!-- Graph Legend -->
    <line x1="150" y1="720" x2="190" y2="720" class="edge" marker-end="url(#arrow)" />
    <text x="205" y="726" font-size="18" fill="#333333">= edge</text>
    <path d="M 290 720 L 330 720" class="edge-blue" marker-end="url(#blue-arrow)" />
    <text x="345" y="726" font-size="18" class="blue-accent">= new reachability</text>


    <!-- ========================================== -->
    <!-- MIDDLE COLUMN: Matrix-Doubling Sequence    -->
    <!-- ========================================== -->

    <text x="1026" y="210" text-anchor="middle" font-size="28" font-weight="bold" fill="#000000">
        Path doubling: A → A<tspan font-size="18" dy="-12">2</tspan><tspan dy="12"> → A</tspan><tspan font-size="18" dy="-12">4</tspan><tspan dy="12"> → …</tspan>
    </text>

    <!-- Matrix Titles -->
    <text x="710" y="320" text-anchor="middle" font-size="32" font-style="italic">A</text>
    <text x="1026" y="320" text-anchor="middle" font-size="32" font-style="italic">A<tspan font-size="20" dy="-14">2</tspan></text>
    <text x="1342" y="320" text-anchor="middle" font-size="32" font-style="italic">A<tspan font-size="20" dy="-14">4</tspan></text>

    <!-- Matrix A Brackets -->
    <path class="bracket" d="M 598 375 L 590 375 L 590 605 L 598 605" />
    <path class="bracket" d="M 822 375 L 830 375 L 830 605 L 822 605" />

    <!-- Matrix A2 Brackets -->
    <path class="bracket" d="M 914 375 L 906 375 L 906 605 L 914 605" />
    <path class="bracket" d="M 1138 375 L 1146 375 L 1146 605 L 1138 605" />

    <!-- Matrix A4 Brackets -->
    <path class="bracket" d="M 1230 375 L 1222 375 L 1222 605 L 1230 605" />
    <path class="bracket" d="M 1454 375 L 1462 375 L 1462 605 L 1454 605" />

