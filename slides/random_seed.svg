 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" width="1400" height="850">
        <!-- Background -->
        <rect width="1400" height="850" fill="#FFFFFF" />

        <defs>
            <!-- Standard Edge Arrow Marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#CCCCCC" />
            </marker>

            <!-- Nodes -->
            <g id="node-reg">
                <circle cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#333333" stroke-width="2" />
            </g>
            <g id="node-dist">
                <circle cx="0" cy="0" r="12" fill="#1F77B4" stroke="#333333" stroke-width="2" />
            </g>

            <!-- Base Grid Edges -->
            <g id="right-edge">
                <line x1="15" y1="0" x2="65" y2="0" stroke="#CCCCCC" stroke-width="2" marker-end="url(#arrow)" />
            </g>
            <g id="down-edge">
                <line x1="0" y1="15" x2="0" y2="55" stroke="#CCCCCC" stroke-width="2" marker-end="url(#arrow)" />
            </g>

            <!-- A Single Row of Rightward Edges -->
            <g id="row-right-edges">
                <use href="#right-edge" x="0" y="0" />
                <use href="#right-edge" x="80" y="0" />
                <use href="#right-edge" x="160" y="0" />
                <use href="#right-edge" x="240" y="0" />
            </g>

            <!-- A Single Column of Downward Edges -->
            <g id="col-down-edges">
                <use href="#down-edge" x="0" y="0" />
                <use href="#down-edge" x="0" y="70" />
                <use href="#down-edge" x="0" y="140" />
            </g>

            <!-- Complete 5x4 Grid Edges -->
            <g id="panel-edges">
                <use href="#row-right-edges" x="0" y="0" />
                <use href="#row-right-edges" x="0" y="70" />
                <use href="#row-right-edges" x="0" y="140" />
                <use href="#row-right-edges" x="0" y="210" />

                <use href="#col-down-edges" x="0" y="0" />
                <use href="#col-down-edges" x="80" y="0" />
                <use href="#col-down-edges" x="160" y="0" />
                <use href="#col-down-edges" x="240" y="0" />
                <use href="#col-down-edges" x="320" y="0" />
            </g>
        </defs>

        <!-- Global Styling for Texts -->
        <style>
            .col-header { font-family: sans-serif; font-size: 22px; font-weight: bold; fill: #333333; letter-spacing: 1px;}
            .title { font-family: sans-serif; font-size: 20px; font-weight: bold; fill: #444444; }
            .annotation { font-family: sans-serif; font-size: 15px; fill: #555555; }
            .math { font-family: Georgia, serif; font-style: italic; }
            .legend-text { font-family: sans-serif; font-size: 14px; fill: #333333; }
        </style>

        <!-- ========================================== -->
        <!-- COLUMN HEADERS                             -->
        <!-- ========================================== -->
        <text x="240" y="45" class="col-header" text-anchor="middle">DETERMINISTIC SELECTION</text>
        <text x="1160" y="45" class="col-header" text-anchor="middle">RANDOMIZED SELECTION</text>


        <!-- ========================================== -->
        <!-- PANEL 1A: Deterministic Left-Block         -->
        <!-- ========================================== -->
        <g transform="translate(80, 110)">
            <text x="160" y="-30" class="title" text-anchor="middle">1A. Left-Block Pattern</text>

            <use href="#panel-edges" x="0" y="0" />

            <!-- Adversary Path -->
            <path d="M 160 0 L 160 210 L 320 210" fill="none" stroke="#D62728" stroke-width="6" stroke-linejoin="round" />

            <!-- Crimson Brackets -->
            <path d="M 175 0 L 185 0 L 185 210 L 175 210" fill="none" stroke="#D62728" stroke-width="2" />
            <path d="M 160 225 L 160 235 L 320 235 L 320 225" fill="none" stroke="#D62728" stroke-width="2" />

            <!-- Nodes -->
            <!-- Col 1, 2 (Blue) -->
            <use href="#node-dist" x="0" y="0" />   <use href="#node-dist" x="80" y="0" />
            <use href="#node-dist" x="0" y="70" />  <use href="#node-dist" x="80" y="70" />
            <use href="#node-dist" x="0" y="140" /> <use href="#node-dist" x="80" y="140" />
            <use href="#node-dist" x="0" y="210" /> <use href="#node-dist" x="80" y="210" />
            <!-- Col 3, 4, 5 (White) -->
            <use href="#node-reg" x="160" y="0" />   <use href="#node-reg" x="240" y="0" />   <use href="#node-reg" x="320" y="0" />
            <use href="#node-reg" x="160" y="70" />  <use href="#node-reg" x="240" y="70" />  <use href="#node-reg" x="320" y="70" />
            <use href="#node-reg" x="160" y="140" /> <use href="#node-reg" x="240" y="140" /> <use href="#node-reg" x="320" y="140" />
            <use href="#node-reg" x="160" y="210" /> <use href="#node-reg" x="240" y="210" /> <use href="#node-reg" x="320" y="210" />

            <!-- Annotation -->
            <text x="160" y="265" class="annotation" text-anchor="middle">Adversary routes path through unselected block. Gap = <tspan class="math">Ω(n)</tspan></text>
        </g>

        <!-- ========================================== -->
        <!-- PANEL 1B: Deterministic Row-Alternating    -->
        <!-- ========================================== -->
        <g transform="translate(80, 480)">
            <text x="160" y="-30" class="title" text-anchor="middle">1B. Row-Alternating Pattern</text>

            <use href="#panel-edges" x="0" y="0" />

            <!-- Adversary Path -->
            <path d="M 0 70 L 320 70" fill="none" stroke="#D62728" stroke-width="6" stroke-linejoin="round" />

            <!-- Crimson Brackets -->
            <path d="M 0 85 L 0 95 L 320 95 L 320 85" fill="none" stroke="#D62728" stroke-width="2" />

            <!-- Nodes -->
            <!-- Row 1, 3 (Blue) -->
            <use href="#node-dist" x="0" y="0" />   <use href="#node-dist" x="80" y="0" />   <use href="#node-dist" x="160" y="0" />   <use href="#node-dist" x="240" y="0" />   <use href="#node-dist" x="320" y="0" />
            <use href="#node-dist" x="0" y="140" /> <use href="#node-dist" x="80" y="140" /> <use href="#node-dist" x="160" y="140" /> <use href="#node-dist" x="240" y="140" /> <use href="#node-dist" x="320" y="140" />
            <!-- Row 2, 4 (White) -->
            <use href="#node-reg" x="0" y="70" />   <use href="#node-reg" x="80" y="70" />   <use href="#node-reg" x="160" y="70" />   <use href="#node-reg" x="240" y="70" />   <use href="#node-reg" x="320" y="70" />
            <use href="#node-reg" x="0" y="210" />  <use href="#node-reg" x="80" y="210" />  <use href="#node-reg" x="160" y="210" />  <use href="#node-reg" x="240" y="210" />  <use href="#node-reg" x="320" y="210" />

            <!-- Annotation -->
            <text x="160" y="265" class="annotation" text-anchor="middle">Adversary routes path along unselected stripe. Gap = <tspan class="math">Ω(n)</tspan></text>
        </g>

        <!-- ========================================== -->
        <!-- BASE GRAPH (Center)                        -->
        <!-- ========================================== -->
        <g transform="translate(540, 290)">
            <text x="160" y="-30" class="title" text-anchor="middle">Base Graph Structure</text>

            <use href="#panel-edges" x="0" y="0" />

            <!-- All White Nodes -->
            <use href="#node-reg" x="0" y="0" />   <use href="#node-reg" x="80" y="0" />   <use href="#node-reg" x="160" y="0" />   <use href="#node-reg" x="240" y="0" />   <use href="#node-reg" x="320" y="0" />
            <use href="#node-reg" x="0" y="70" />  <use href="#node-reg" x="80" y="70" />  <use href="#node-reg" x="160" y="70" />  <use href="#node-reg" x="240" y="70" />  <use href="#node-reg" x="320" y="70" />
            <use href="#node-reg" x="0" y="140" /> <use href="#node-reg" x="80" y="140" /> <use href="#node-reg" x="160" y="140" /> <use href="#node-reg" x="240" y="140" /> <use href="#node-reg" x="320" y="140" />
            <use href="#node-reg" x="0" y="210" /> <use href="#node-reg" x="80" y="210" /> <use href="#node-reg" x="160" y="210" /> <use href="#node-reg" x="240" y="210" /> <use href="#node-reg" x="320" y="210" />

            <!-- Annotation -->
            <text x="160" y="265" class="annotation" text-anchor="middle">The underlying sparse directed grid.</text>
        </g>

        <!-- ========================================== -->
        <!-- PANEL 2A: Randomized Alpha                 -->
        <!-- ========================================== -->
        <g transform="translate(1000, 110)">
            <text x="160" y="-30" class="title" text-anchor="middle">2A. Random Seed Alpha</text>

            <use href="#panel-edges" x="0" y="0" />

            <!-- Tested Path -->
            <path d="M 160 0 L 160 210 L 320 210" fill="none" stroke="#2CA02C" stroke-width="6" stroke-linejoin="round" />

            <!-- Green Brackets -->
            <path d="M 175 0 L 185 0 L 185 70 L 175 70" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 175 70 L 185 70 L 185 210 L 175 210" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 160 225 L 160 235 L 240 235 L 240 225" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 240 225 L 240 235 L 320 235 L 320 225" fill="none" stroke="#2CA02C" stroke-width="2" />

            <!-- Nodes -->
            <!-- Row 1 -->
            <use href="#node-dist" x="0" y="0" />   <use href="#node-reg" x="80" y="0" />   <use href="#node-reg" x="160" y="0" />   <use href="#node-dist" x="240" y="0" />   <use href="#node-reg" x="320" y="0" />
            <!-- Row 2 -->
            <use href="#node-reg" x="0" y="70" />   <use href="#node-dist" x="80" y="70" /> <use href="#node-dist" x="160" y="70" /> <use href="#node-reg" x="240" y="70" />  <use href="#node-dist" x="320" y="70" />
            <!-- Row 3 -->
            <use href="#node-dist" x="0" y="140" /> <use href="#node-reg" x="80" y="140" /> <use href="#node-dist" x="160" y="140" /> <use href="#node-reg" x="240" y="140" /> <use href="#node-dist" x="320" y="140" />
            <!-- Row 4 -->
            <use href="#node-reg" x="0" y="210" />  <use href="#node-dist" x="80" y="210" /> <use href="#node-reg" x="160" y="210" /> <use href="#node-dist" x="240" y="210" /> <use href="#node-reg" x="320" y="210" />

            <!-- Annotation -->
            <text x="160" y="265" class="annotation" text-anchor="middle">Path is fractured. Max gap bounded by <tspan class="math">Õ((n log n)/s)</tspan></text>
        </g>

        <!-- ========================================== -->
        <!-- PANEL 2B: Randomized Beta                  -->
        <!-- ========================================== -->
        <g transform="translate(1000, 480)">
            <text x="160" y="-30" class="title" text-anchor="middle">2B. Random Seed Beta</text>

            <use href="#panel-edges" x="0" y="0" />

            <!-- Tested Path (Snaking) -->
            <path d="M 0 0 L 80 0 L 80 70 L 160 70 L 160 140 L 240 140 L 240 210 L 320 210" fill="none" stroke="#2CA02C" stroke-width="6" stroke-linejoin="round" />

            <!-- Green Brackets -->
            <path d="M 0 -15 L 0 -25 L 80 -25 L 80 -15" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 95 0 L 105 0 L 105 70 L 95 70" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 80 55 L 80 45 L 160 45 L 160 55" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 175 70 L 185 70 L 185 140 L 175 140" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 160 125 L 160 115 L 240 115 L 240 125" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 255 140 L 265 140 L 265 210 L 255 210" fill="none" stroke="#2CA02C" stroke-width="2" />
            <path d="M 240 225 L 240 235 L 320 235 L 320 225" fill="none" stroke="#2CA02C" stroke-width="2" />

            <!-- Nodes -->
            <!-- Row 1 -->
            <use href="#node-reg" x="0" y="0" />   <use href="#node-reg" x="80" y="0" />   <use href="#node-dist" x="160" y="0" />   <use href="#node-reg" x="240" y="0" />   <use href="#node-dist" x="320" y="0" />
            <!-- Row 2 -->
            <use href="#node-dist" x="0" y="70" /> <use href="#node-dist" x="80" y="70" /> <use href="#node-reg" x="160" y="70" />   <use href="#node-dist" x="240" y="70" /> <use href="#node-reg" x="320" y="70" />
            <!-- Row 3 -->
            <use href="#node-dist" x="0" y="140" /> <use href="#node-reg" x="80" y="140" /> <use href="#node-dist" x="160" y="140" /> <use href="#node-reg" x="240" y="140" /> <use href="#node-dist" x="320" y="140" />
            <!-- Row 4 -->
            <use href="#node-reg" x="0" y="210" /> <use href="#node-dist" x="80" y="210" /> <use href="#node-reg" x="160" y="210" /> <use href="#node-dist" x="240" y="210" /> <use href="#node-reg" x="320" y="210" />

            <!-- Annotation -->
            <text x="160" y="265" class="annotation" text-anchor="middle">Adversary cannot predict gaps. Parallel searches succeed.</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(0, 0)">
            <!-- Legend Box -->
            <rect x="280" y="770" width="840" height="45" rx="5" fill="#F9F9F9" stroke="#E0E0E0" stroke-width="1" />

            <!-- Legend Items -->
            <use href="#node-reg" x="320" y="792" />
            <text x="340" y="797" class="legend-text">Regular Node</text>

            <use href="#node-dist" x="480" y="792" />
            <text x="500" y="797" class="legend-text">Distinguished Node</text>

            <path d="M 660 792 L 700 792" fill="none" stroke="#D62728" stroke-width="4" />
            <text x="710" y="797" class="legend-text">Unbounded Gap (Worst-Case)</text>

            <path d="M 940 792 L 980 792" fill="none" stroke="#2CA02C" stroke-width="4" />
            <text x="990" y="797" class="legend-text">Bounded Gap (High-Probability)</text>
        </g>
    </svg>
