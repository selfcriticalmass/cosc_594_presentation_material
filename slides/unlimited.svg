<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <!-- Standard Arrow Marker -->
    <marker id="arrow" viewBox="0 -5 10 10" refX="30" refY="0" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,-5 L10,0 L0,5" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Edges (Rendered first so they sit behind nodes) -->
  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)">
    <line x1="100" y1="50" x2="400" y2="200" />
    <line x1="100" y1="150" x2="400" y2="200" />
    <line x1="100" y1="250" x2="400" y2="200" />
    <line x1="100" y1="350" x2="400" y2="200" />
    <line x1="400" y1="200" x2="700" y2="50" />
    <line x1="400" y1="200" x2="700" y2="150" />
    <line x1="400" y1="200" x2="700" y2="250" />
    <line x1="400" y1="200" x2="700" y2="350" />
  </g>

  <!-- Nodes -->
  <g font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1f2937">

    <!-- Central Node V -->
    <g transform="translate(400, 200)">
      <circle r="20" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" />
      <text dy=".3em">V</text>
    </g>

    <!-- Predecessor Nodes (P1-P4) -->
    <g transform="translate(100, 50)">
      <circle r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
      <text dy=".3em">P1</text>
    </g>
    <g transform="translate(100, 150)">
      <circle r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
      <text dy=".3em">P2</text>
    </g>
    <g transform="translate(100, 250)">
      <circle r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
      <text dy=".3em">P3</text>
    </g>
    <g transform="translate(100, 350)">
      <circle r="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" />
      <text dy=".3em">P4</text>
    </g>

    <!-- Successor Nodes (S1-S4) -->
    <g transform="translate(700, 50)">
      <circle r="20" fill="#dcfce3" stroke="#22c55e" stroke-width="2" />
      <text dy=".3em">S1</text>
    </g>
    <g transform="translate(700, 150)">
      <circle r="20" fill="#dcfce3" stroke="#22c55e" stroke-width="2" />
      <text dy=".3em">S2</text>
    </g>
    <g transform="translate(700, 250)">
      <circle r="20" fill="#dcfce3" stroke="#22c55e" stroke-width="2" />
      <text dy=".3em">S3</text>
    </g>
    <g transform="translate(700, 350)">
      <circle r="20" fill="#dcfce3" stroke="#22c55e" stroke-width="2" />
      <text dy=".3em">S4</text>
    </g>
  </g>
</svg>
